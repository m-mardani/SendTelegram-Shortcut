# hold2tg configuration  —  ~/.config/hold2tg/config.ini
# Keep this file private (chmod 600): it holds your bot token.

[telegram]
# Token from @BotFather, e.g. 123456789:AAE...
bot_token =

# The channel to post to: @username for a public channel, or the numeric id
# (-100...) for a private one. Run `hold2tg chats` to find the numeric id.
# The bot must be an admin of the channel with permission to post.
chat_id =

# Optional proxy for reaching Telegram, e.g. a local v2ray/xray inbound:
#   socks5h://127.0.0.1:10808     or     http://127.0.0.1:10809
proxy =

# Only change this if you run your own Bot API server or a reverse proxy.
api_base = https://api.telegram.org

# true = post without a notification sound for channel members
silent = false

[hotkey]
# Modifiers: ctrl, shift, alt, super, capslock. Keys: a-z, 0-9, f1-f12, space, insert, ...
# With capslock, GNOME's caps:hyper keyboard option is turned on: Caps Lock
# then works as a modifier and no longer turns on capitals.
# These are physical keys, so the hotkey works in any keyboard layout.
keys = capslock+c

# How long the keys must be held before sending.
hold_seconds = 5

# Copies the newest message of the channel to the clipboard: its text, or
# its file(s), ready to paste into Files with Ctrl+V. Empty = turned off.
fetch_keys = capslock+v

# How long to hold them (0 = act on the press itself)
fetch_hold_seconds = 5

# Opens a small box with the translation of the highlighted text: other
# languages into Persian (with other meanings and examples for a word),
# Persian into English. Empty = turned off.
translate_keys = capslock+t
translate_hold_seconds = 5

# Shows the clipboard history, like Win+V on Windows: what you copied lately,
# in a panel in the middle of the screen; click one to paste it. Empty = turned
# off (then nothing is recorded either). The GNOME Shell extension opens it on
# the press; history_hold_seconds only applies to hold2tg's own fallback box.
history_keys = capslock+h
history_hold_seconds = 0

[history]
# How many copies to keep (newest first; pinned ones are kept besides, and the
# extension keeps 10 to 500). Copies a password manager marks as secret are
# never kept.
size = 100

[translate]
# Text in any other language is translated into `language`, text already in
# `language` into `second_language` (language codes as Google uses them).
language = fa
second_language = en

# Proxy for Google Translate. Empty = the same proxy as [telegram],
# none = connect directly.
proxy =

[behavior]
# Desktop notifications ("sending…", "sent ✓", errors)
notifications = true
# Language of the notifications, the boxes and the clipboard panel: en or fa
language = en

# Files larger than this are skipped. Telegram's limit for bots is 50 MB.
max_file_mb = 50

# Safety net: refuse to send when more files than this are selected.
max_files = 20

# Send a selected folder as a .zip (false = skip folders)
zip_folders = true

# How to read the highlighted text: auto, xclip, xsel or wl-paste
text_backend = auto
