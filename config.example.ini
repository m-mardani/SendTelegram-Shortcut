# hold2tg configuration  —  ~/.config/hold2tg/config.ini
# Keep this file private (chmod 600): it holds your bot token.

[telegram]
# Token from @BotFather, e.g. 123456789:AAE...
bot_token =

# The channel to post to: @username for a public channel, or the numeric id
# (-100...) for a private one. Run `hold2tg chats` to find the numeric id.
# The bot must be an admin of the channel with permission to post.
chat_id =

# Optional proxy for reaching Telegram, e.g. a local v2ray/xray inbound:
#   socks5h://127.0.0.1:10808     or     http://127.0.0.1:10809
proxy =

# Only change this if you run your own Bot API server or a reverse proxy.
api_base = https://api.telegram.org

# true = post without a notification sound for channel members
silent = false

[hotkey]
# Modifiers: ctrl, shift, alt, super. Keys: a-z, 0-9, f1-f12, space, insert, ...
# These are physical keys, so the hotkey works in any keyboard layout.
keys = ctrl+shift+s

# How long the keys must be held before sending.
hold_seconds = 5

[behavior]
# Desktop notifications ("sending…", "sent ✓", errors)
notifications = true
# Language of the notifications: fa or en
language = fa

# Files larger than this are skipped. Telegram's limit for bots is 50 MB.
max_file_mb = 50

# Safety net: refuse to send when more files than this are selected.
max_files = 20

# Send a selected folder as a .zip (false = skip folders)
zip_folders = true

# How to read the highlighted text: auto, xclip, xsel or wl-paste
text_backend = auto
